name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parallax-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # Signed release APK.
  #
  # Gated on the repository secret existing, so a fork or a fresh clone skips
  # this job instead of failing on a missing key. The debug artifact above is
  # produced either way.
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The keystore arrives base64 encoded so the signing key never enters
      # version control under any circumstance.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "keystore decode failed"; exit 1; }

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # An unsigned release is the exact failure this project had before, and
      # it looks fine on disk. Prove the signature rather than assume it.
      - name: Verify the release APK is signed
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK" | tee verify.txt
          grep -q "^Verifies" verify.txt || { echo "APK is NOT signed"; exit 1; }
          "$ANDROID_HOME"/build-tools/"$(basename "$(dirname "$APKSIGNER")")"/aapt2 \
            dump badging "$APK" | head -1

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: parallax-launcher-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator:
    name: Instrumented smoke test (emulator)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No KVM on this project's dev machines (nested virt is not exposed), so the emulator has
      # to run on the cloud runner instead. `disable-animations` keeps Espresso from waiting on
      # transitions, and no-snapshot avoids the GPU swiftshader stalls on CI.
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -camera-back none

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: warn
